name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet restore NkuThesisTool.sln
      - run: dotnet build NkuThesisTool.sln --no-restore --configuration Release
      - run: dotnet test NkuThesisTool.sln --no-build --configuration Release
